name: Release

# Builds archiguard.zip (extension), archiguard-preset.zip (preset) and archiguard-sdd.yml (workflow)
# and attaches them with SHA256SUMS to the GitHub release. Runs when a vX.Y.Z tag is pushed, when a
# release is published in the GitHub UI (which also creates the tag), or manually for an existing tag.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build the release assets for, e.g. v0.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pytest && python -m pytest -q
      - name: build archives
        run: python tools/build.py --check-tag "$TAG"
      - name: publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(python - <<'PY'
          import os, re
          tag = os.environ["TAG"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[" + re.escape(tag) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          print(m.group(1).strip() if m else "See CHANGELOG.md")
          PY
          )
          assets=(dist/archiguard.zip dist/archiguard-preset.zip dist/archiguard-sdd.yml dist/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --title "archiGuard $TAG" --notes "$notes"
          fi
