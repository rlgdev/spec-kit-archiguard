  - id: ARCH-101
    title: HTTP APIs are published as OpenAPI 3 contracts
    level: must
    skill: api-contracts
    skill_path: skills/api-contracts/SKILL.md
    targets: [contract, code]
    check: declared
    applies_when:
      stack: [java]
      contexts: []
    sources: ["profile:java-service"]
    text: Every HTTP API is described by an OpenAPI 3 document in contracts/ before it is implemented.
    checks:
      - target: contract
        kind: require_text
        files: ["contracts/*.{yaml,yml,json}"]
        pattern: "openapi:\\s*['\"]?3\\."
        fix_hint: add an OpenAPI 3 document for the API to contracts/
      - target: code
        kind: contract_routes
        sources: ["src/main/**/*.java"]
    hash: "sha256:03c9e2eaf767c0dad6479d21f9d0296601d1b9fc38c7839a386469e18f8e12da"
  - id: ARCH-201
    title: "Layers depend downwards only (api -> application -> domain)"
    level: must
    skill: layering
    skill_path: skills/layering/SKILL.md
    targets: [plan, code]
    check: declared
    applies_when:
      stack: [java]
      contexts: []
    sources: ["profile:java-service"]
    text: null
    checks:
      - target: code
        kind: layers
        scope: context
        layers:
          - name: api
            files: ["**/api/**"]
            modules: ["\\.api\\."]
          - name: application
            files: ["**/application/**"]
            modules: ["\\.application\\."]
          - name: domain
            files: ["**/domain/**"]
            modules: ["\\.domain\\."]
          - name: infrastructure
            files: ["**/infrastructure/**"]
            modules: ["\\.infrastructure\\."]
        allow:
          api: [application, domain]
          application: [domain]
          infrastructure: [application, domain]
          domain: []
    hash: "sha256:473f4fe8afe2b44a9980234c13343a469d017e062ea33e43701036307ec849c2"
