rules:
  - id: ARCH-401
    title: No credentials in source code
    level: must
    checks:
      - target: edit
        kind: forbid_text
        files: ["src/**"]
        pattern: "(?i)(password|secret)\\s*=\\s*\"[^\"]+\""
      - target: code
        kind: forbid_text
        files: ["src/**"]
        pattern: "(?i)(password|secret)\\s*=\\s*\"[^\"]+\""
